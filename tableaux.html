<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>les tableaux en html</title>
  </head>
  <body>
    <h1>les bases des tableaux en html (table, tr(ligne),td(case))</h1>
    <table border="1" align="center" width="400">
      <caption>
        nos tarifs
      </caption>
      <tr>
        <th>Produits</th>
        <th>Prix</th>
      </tr>
      <tr>
        <td>hp dv 7</td>
        <td>7000</td>
      </tr>
      <tr>
        <td>dell satellite</td>
        <td>5600</td>
      </tr>
    </table>
  </body>
</html>
